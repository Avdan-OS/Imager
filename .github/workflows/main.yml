name: Imager CI

on:
  push:
    branches: [native-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cli-binary: build/imager
            gui-binary: build/imager-gui
          - name: macOS
            os: macos-latest
            cli-binary: build/imager
            gui-binary: build/imager-gui
          - name: Windows
            os: windows-latest
            cli-binary: build/Release/imager.exe
            gui-binary: build/Release/imager-gui.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            zlib1g-dev liblzma-dev libbz2-dev libzstd-dev \
            libgtk-3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake xz zstd

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib liblzma bzip2 zstd --triplet x64-windows

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          test -x "${{ matrix.cli-binary }}"
          "${{ matrix.cli-binary }}" --help || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ matrix.cli-binary }}")) { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imager-${{ runner.os }}
          path: |
            ${{ matrix.cli-binary }}
            ${{ matrix.gui-binary }}
          if-no-files-found: error
